<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>瞬間英作文音声練習ドリル</title>

<style>

body{
  font-family:sans-serif;
  text-align:center;

  min-height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:20px;
  box-sizing:border-box;
}

.top-area{

  position:fixed;

  top:10px;

  left:10px;

  z-index:1000;

}

#micButton{

  width:200px;

  height:70px;

  font-size:24px;

  background:#ffd966;

  border:3px solid #cc9900;

  border-radius:15px;

}

#unitSelect{

  width:220px;

  font-size:24px;

  padding:8px;

  display:block;

  margin:0 auto 15px auto;

}

#ja{
  font-size:45px;
  font-weight:bold;
  margin-bottom:20px;
  line-height:1.4;
}

#answer{
  margin-top:10px;
  font-size:40px;
  color:blue;
  line-height:1.4;
}

input{
  width:90%;
  max-width:700px;

  font-size:30px;

  padding:15px;

  display:block;
  margin:20px auto;

  text-align:center;
}

.button-area{
  display:flex;
  flex-direction:column;
  align-items:center;

  gap:25px;

  margin-top:20px;
}

button{

  width:280px;

  height:90px;

  font-size:32px;

  border-radius:15px;

  cursor:pointer;
}

#result{
  margin-top:25px;
  font-size:28px;
  white-space:pre-line;
}

@media (max-width:600px){

  #unitSelect{

    font-size:34px;

  }

  #ja{
    font-size:20px;
  }

  #answer{
    font-size:20px;
  }

  input{
    font-size:15px;
  }

  button{
    width:260px;
    height:80px;
    font-size:33px;
  }

  #result{
    font-size:20px;
  }

}

</style>
</head>


<body>

<div class="top-area">

<button id="micButton" onclick="start()">
🎤 マイクを使う
</button>

</div>


<select id="unitSelect" onchange="changeUnit()">

<option value="all">全部</option>

<option value="肯定文第三文型">肯定文第三文型</option>

<option value="疑問文第三文型">疑問文第三文型</option>

<option value="命令文第三文型">命令文第三文型</option>

<option value="疑問詞③">疑問詞③</option>

</select>


<h2 id="ja"></h2>

<div id="result"></div>

<div id="answer"></div>


<input
id="voiceText"
type="text"
placeholder="ここに認識結果が表示されます"
>


<div class="button-area">

<button onclick="stop()">判定</button>

<button onclick="nextQuestion()">次の問題</button>

<button onclick="repeatAudio()">もう一回聞く</button>

</div>




<script src="data.js"></script>

<script>


let current = 0;

let currentData = data;

let speech = null;

let latestText = "";

let wrongQuestions = [];


// 現在、マイクを聞き続けたい状態か
let listening = false;


// 判定処理中か
let judging = false;


function normalize(text){

  return text
    .toLowerCase()
    .replace(/[.,!?]/g,"")
    .trim();

}


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  speech = new SpeechRecognition();

  speech.lang = "en-US";

  speech.continuous = true;

  speech.interimResults = false;


  // 音声を認識したとき
  speech.onresult = function(e){

    latestText =
      e.results[e.results.length - 1][0].transcript;

    document.getElementById("voiceText").value =
      latestText;

  };


  // 音声認識が終了したとき
  speech.onend = function(){

    /*
      子どもが考えている途中などに、
      ブラウザ側が音声認識を終了することがあります。

      その場合は自動的にもう一度開始します。
    */

    if(listening && !judging){

      setTimeout(() => {

        try{

          speech.start();

        }catch(error){

          console.log(error);

        }

      },300);

    }

  };


  // マイク・音声認識のエラー
  speech.onerror = function(event){

    console.log("音声認識エラー:", event.error);


    /*
      判定中ではなく、マイクを使いたい状態なのに
      エラーが出た場合だけメッセージを表示します。
    */

    if(!judging){

      if(
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ){

        document.getElementById("result").innerText =
          "🎤 マイクが使えません。\n" +
          "スマホの設定でChromeのマイクを「許可」にしてください。";

      }

      else if(event.error === "no-speech"){

        /*
          無音による終了は、
          onendで自動的に再スタートするので
          エラーメッセージは表示しません。
        */

      }

      else{

        document.getElementById("result").innerText =
          "🎤 マイクを確認してください。";

      }

    }

  };


}else{

  alert("このブラウザは音声認識に対応していません");

}



function showQuestion(){

  document.getElementById("ja").innerText =
    currentData[current].ja;

  document.getElementById("answer").innerText = "";

  document.getElementById("result").innerText = "";

  document.getElementById("voiceText").value = "";

  latestText = "";

}


showQuestion();



function speakAnswer(message){

  speechSynthesis.cancel();

  const uttr =
    new SpeechSynthesisUtterance(message);

  uttr.lang = "en-US";

  uttr.rate = 1.0;

  speechSynthesis.speak(uttr);

}



function start(){

  if(!speech){

    return;

  }


  /*
    マイクを使いたい状態にする
  */

  listening = true;

  judging = false;

  latestText = "";


  try{

    speech.start();

    /*
      正常に開始したらボタンを消す
    */

    document.getElementById(
      "micButton"
    ).style.display = "none";

  }catch(error){

    console.log(error);

  }

}



function stop(){

  /*
    ここで「聞き続けたい状態」を終了させます。

    これをしないと、
    speech.stop() → onend → 自動再スタート
    となってしまいます。
  */

  listening = false;

  judging = true;


  if(speech){

    try{

      speech.stop();

    }catch(error){

      console.log(error);

    }

  }


  setTimeout(() => {

    judge();

  },100);

}



function judge(){

  const user =
    normalize(latestText);

  const correct =
    normalize(currentData[current].en);


  speechSynthesis.cancel();


  if(user === correct){

    document.getElementById("result").innerText =
      "◎ 正解！";

    document.getElementById("answer").innerText =
      currentData[current].en;


    speakAnswer(
      currentData[current].en
    );

  }

  else{

    document.getElementById("result").innerText =
      "❌ ちがいます";

    document.getElementById("answer").innerText =
      currentData[current].en;


    if(!wrongQuestions.includes(currentData[current])){

      wrongQuestions.push(
        currentData[current]
      );

    }


    speakAnswer(
      currentData[current].en
    );

  }

}



function nextQuestion(){

  speechSynthesis.cancel();


  /*
    次の問題では、
    またマイクを使う状態に戻します。
  */

  listening = false;

  judging = false;


  current++;


  if(current >= currentData.length){

    if(wrongQuestions.length > 0){

      currentData = [...wrongQuestions];

      wrongQuestions = [];

      current = 0;


      alert(
        "復習スタート！\n間違えた問題をもう一度やります。"
      );

    }

    else{

      alert("クリア！");

      current = 0;

      showQuestion();

      /*
        クリア後は最初の問題に戻るので
        マイクボタンを再表示
      */

      document.getElementById(
        "micButton"
      ).style.display = "block";

      return;

    }

  }


  showQuestion();


  /*
    少し待ってからマイク開始
  */

  setTimeout(() => {

    start();

  },300);

}



function repeatAudio(){

  speakAnswer(
    currentData[current].en
  );

}



function changeUnit(){

  /*
    問題を切り替えたら、
    一度音声認識を止めます。
  */

  listening = false;

  judging = false;


  if(speech){

    try{

      speech.stop();

    }catch(error){

      console.log(error);

    }

  }


  const selected =
    document.getElementById(
      "unitSelect"
    ).value;


  if(selected === "all"){

    currentData = data;

  }else{

    currentData =
      data.filter(
        q => q.unit === selected
      );

  }


  current = 0;


  showQuestion();


  /*
    マイクボタンを再表示
  */

  document.getElementById(
    "micButton"
  ).style.display = "block";

}


</script>

</body>
</html>
